<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Categorías</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/tipoclienteStyles.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
<div class="container mt-5">
    <div class="text-center mb-5">
        <h1 class="fw-bold text-dark">Categorías de Fidelización</h1>
        <p class="text-muted">Administra los niveles de acceso y etiquetas de los clientes</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <a th:href="@{/tiposcliente/nuevo}" class="btn btn-success rounded-pill px-4 shadow-sm">
                    <i class="bi bi-plus-circle-fill"></i> Nuevo Tipo de Cliente
                </a>
                <a th:href="@{/clientes}" class="btn btn-outline-primary rounded-pill px-4">
                    <i class="bi bi-arrow-left"></i> Volver a Clientes
                </a>
            </div>
            
            <div class="list-group shadow-sm border-0">
                <div th:each="t : ${tipos}" class="list-group-item category-item p-4 border-0 mb-3 shadow-sm rounded-4 d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center">
                        <div class="category-icon me-3" th:text="${t.id}"></div>
                        <span class="fs-4 fw-bold text-dark" th:text="${t.nombre}"></span>
                    </div>
                    <div class="btn-group">
                        <a th:href="@{/tiposcliente/editar/{id}(id=${t.id})}" class="btn btn-warning btn-sm px-3 rounded-pill me-2">
                            <i class="bi bi-pencil-fill"></i> Editar
                        </a>
                        <a th:href="@{/tiposcliente/eliminar/{id}(id=${t.id})}" 
                           class="btn btn-danger btn-sm px-3 rounded-pill"
                           onclick="return confirm('¿Estás seguro de eliminar esta categoría? Los clientes asociados quedarán sin tipo.')">
                            <i class="bi bi-trash3-fill"></i> Borrar
                        </a>
                    </div>
                </div>
                
                <div th:if="${tipos.empty}" class="alert alert-info text-center rounded-4 p-5">
                    <i class="bi bi-info-circle fs-1 d-block mb-3"></i>
                    No hay categorías creadas. ¡Empieza creando la primera!
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
