<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Panel de Control - Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/styles.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
<div class="container mt-5">
    <div class="header-section d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="display-5 fw-bold text-primary">Sistema ClientApp</h1>
            <p class="text-muted">Gestión centralizada de clientes y categorías</p>
        </div>
        <div class="actions">
            <a th:href="@{/clientes/nuevo}" class="btn btn-primary btn-lg shadow-sm">
                <i class="bi bi-person-plus-fill"></i> Nuevo Cliente
            </a>
            <a th:href="@{/tiposcliente}" class="btn btn-outline-dark btn-lg shadow-sm ms-2">
                <i class="bi bi-gear-fill"></i> Configurar Tipos
            </a>
        </div>
    </div>

    <div class="card border-0 shadow-lg">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Perfil</th>
                        <th>ID</th>
                        <th>Nombre y Apellido</th>
                        <th>Edad</th>
                        <th>Categoría</th>
                        <th>Promedio</th>
                        <th class="text-center pe-4">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cliente : ${clientes}" class="align-middle">
                        <td class="ps-4">
                            <img th:src="@{/uploads/images/{img}(img=${cliente.foto})}" class="client-img shadow-sm">
                        </td>
                        <td class="fw-bold" th:text="${cliente.id}"></td>
                        <td th:text="${cliente.nombre + ' ' + cliente.apellido}"></td>
                        <td th:text="${cliente.edad}"></td>
                        <td>
                            <span th:if="${cliente.tipoCliente != null}" 
                                  th:classappend="${cliente.tipoCliente.nombre == 'Premium' ? 'badge-premium' : 'badge-normal'}"
                                  class="badge-custom" 
                                  th:text="${cliente.tipoCliente.nombre}"></span>
                            <span th:unless="${cliente.tipoCliente != null}" class="text-muted small italic">Pendiente</span>
                        </td>
                        <td class="text-success fw-bold" th:text="'$' + ${cliente.promedioCompras}"></td>
                        <td class="text-center pe-4">
                            <a th:href="@{/clientes/editar/{id}(id=${cliente.id})}" class="btn btn-warning btn-sm mx-1">
                                <i class="bi bi-pencil-square"></i>
                            </a>
                            <a th:href="@{/clientes/eliminar/{id}(id=${cliente.id})}" class="btn btn-danger btn-sm mx-1" 
                               onclick="return confirm('¿Estás seguro de eliminar este cliente?')">
                                <i class="bi bi-trash3-fill"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
