<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tienda de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-5">
        <h1 class="fw-bold text-dark">Nuestros Productos</h1>
        <div>
            <a th:href="@{/productos/nuevo}" class="btn btn-primary rounded-pill px-4 shadow">+ Agregar Producto</a>
            <a th:href="@{/clientes}" class="btn btn-outline-secondary rounded-pill px-4 ms-2">Volver</a>
        </div>
    </div>

    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="p : ${productos}">
            <div class="card h-100 shadow-sm border-0 rounded-4 overflow-hidden">
                <img th:src="@{/uploads/images/{img}(img=${p.foto})}" class="card-img-top" style="height: 250px; object-fit: cover;">
                <div class="card-body text-center">
                    <h5 class="card-title fw-bold" th:text="${p.nombre}"></h5>
                    <div class="mt-3">
                        <a th:href="@{/productos/editar/{id}(id=${p.id})}" class="btn btn-warning btn-sm">Editar</a>
                        <a th:href="@{/productos/eliminar/{id}(id=${p.id})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Borrar producto?')">Borrar</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
