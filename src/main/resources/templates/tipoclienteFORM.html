<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Configurar Categoría</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/tipoclienteStyles.css}">
</head>
<body class="d-flex align-items-center vh-100" style="background: #f0f2f5;">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-success text-white p-4 text-center border-0">
                    <h3 class="mb-0 fw-bold" 
                        th:text="${tipoCliente.id == 0} ? 'Crear Categoría' : 'Editar Categoría'"></h3>
                </div>
                <div class="card-body p-5">
                    <form th:action="${tipoCliente.id == 0} ? @{/tiposcliente/guardar} : @{/tiposcliente/actualizar}" 
                          th:object="${tipoCliente}" method="post">
                        
                        <input type="hidden" th:field="*{id}"/>

                        <div class="mb-4">
                            <label for="nombre" class="form-label fw-bold text-secondary">Nombre de la Categoría</label>
                            <input type="text" class="form-control form-control-lg border-2 shadow-sm" 
                                   id="nombre" th:field="*{nombre}" 
                                   placeholder="Ej: Premium, VIP, Estándar" required>
                            <div class="form-text mt-2">Este nombre aparecerá en el desplegable de clientes.</div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg shadow-sm">
                                <i class="bi bi-check-circle"></i> Guardar Categoría
                            </button>
                            <a th:href="@{/tiposcliente}" class="btn btn-light btn-lg text-muted">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
